<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <radialGradient id="seaBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#002b4d"/>
      <stop offset="60%" stop-color="#001426"/>
      <stop offset="100%" stop-color="#00070d"/>
    </radialGradient>
    <linearGradient id="waterGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055bb"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#90e0ef"/>
    </linearGradient>
    <filter id="waterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background circular base -->
  <circle cx="48" cy="48" r="44" fill="url(#seaBg)"/>
  
  <!-- Outer Ring Elements -->
  <circle cx="48" cy="48" r="42" fill="none" stroke="#0077b6" stroke-width="2" stroke-dasharray="3 3" opacity="0.8"/>

  <!-- Water Dragon Swirl & Head -->
  <g filter="url(#waterGlow)">
    <!-- Swirling Vortex Body -->
    <path d="M 48,88 C 24,88 12,68 14,48 C 16,28 32,14 52,14 C 72,14 84,28 82,46 C 80,62 68,72 54,72 C 40,72 32,62 34,50 C 36,38 46,32 54,36" fill="none" stroke="url(#waterGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Dragon Head -->
    <path d="M 46,20 L 64,16 L 76,28 L 68,40 L 52,42 L 50,30 Z" fill="#003566" stroke="#48cae4" stroke-width="2"/>
    <!-- Dragon Horns/Fins -->
    <path d="M 60,18 Q 72,8 84,14 Q 72,20 66,22" fill="#0077b6"/>
    <path d="M 68,26 Q 82,24 88,32 Q 78,34 72,32" fill="#0077b6"/>
    <!-- Glowing Eye -->
    <circle cx="62" cy="26" r="3" fill="#ffffff"/>
    <circle cx="63" cy="26" r="1.5" fill="#00b4d8"/>
    <!-- Open Jaws & Breath -->
    <polygon points="46,26 36,24 42,32" fill="#caf0f8"/>
    <polygon points="48,36 38,40 45,34" fill="#caf0f8"/>
    <!-- Water Splashes / Droplets -->
    <circle cx="28" cy="30" r="2.5" fill="#90e0ef"/>
    <circle cx="22" cy="48" r="3" fill="#caf0f8"/>
    <circle cx="34" cy="74" r="2" fill="#90e0ef"/>
    <circle cx="70" cy="62" r="2.5" fill="#caf0f8"/>
  </g>

  <!-- Rim highlight -->
  <circle cx="48" cy="48" r="44" fill="none" stroke="#48cae4" stroke-width="3"/>
</svg>
