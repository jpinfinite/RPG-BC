<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="clockBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14244a" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#0a1228" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="timeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#00b4d8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#80ed99" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Large outer clock rim -->
  <circle cx="200" cy="200" r="185" fill="url(#clockBg)"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#timeGold)" stroke-width="3"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="#48cae4" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 4"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#timeGold)" stroke-width="2"/>
  <circle cx="200" cy="200" r="95" fill="none" stroke="#90e0ef" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="3 3"/>

  <!-- Gear Teeth Outer Arc -->
  <g stroke="url(#timeGold)" stroke-width="3" opacity="0.35">
    <line x1="200" y1="15" x2="200" y2="28"/>
    <line x1="200" y1="372" x2="200" y2="385"/>
    <line x1="15" y1="200" x2="28" y2="200"/>
    <line x1="372" y1="200" x2="385" y2="200"/>
    <line x1="69" y1="69" x2="78" y2="78"/>
    <line x1="322" y1="322" x2="331" y2="331"/>
    <line x1="331" y1="69" x2="322" y2="78"/>
    <line x1="69" y1="331" x2="78" y2="322"/>
  </g>

  <!-- Clock Hands pointing through dimensions -->
  <!-- Hour hand -->
  <line x1="200" y1="200" x2="245" y2="135" stroke="#ffd166" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <!-- Minute hand -->
  <line x1="200" y1="200" x2="140" y2="85" stroke="#00b4d8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- Center Core -->
  <circle cx="200" cy="200" r="12" fill="#0077b6" opacity="0.4"/>
  <circle cx="200" cy="200" r="6" fill="#ffd166" opacity="0.7"/>

  <!-- Roman Numeral / Arcane ticks on dial -->
  <g fill="#90e0ef" opacity="0.4" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="200" y="55">XII</text>
    <text x="350" y="205">III</text>
    <text x="200" y="358">VI</text>
    <text x="50" y="205">IX</text>
  </g>
</svg>
