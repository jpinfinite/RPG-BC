<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="juliusBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#005f73"/>
      <stop offset="60%" stop-color="#0a1d37"/>
      <stop offset="100%" stop-color="#030814"/>
    </radialGradient>
    <linearGradient id="goldJulius" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe6a7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997b20"/>
    </linearGradient>
    <filter id="timeHalo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="80" cy="80" r="74" fill="url(#juliusBg)"/>
  <circle cx="80" cy="80" r="72" fill="none" stroke="url(#goldJulius)" stroke-width="3"/>
  <circle cx="80" cy="80" r="67" fill="none" stroke="#00b4d8" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>

  <!-- Halo of Temporal Magic -->
  <circle cx="80" cy="80" r="54" fill="none" stroke="#90e0ef" stroke-width="1.5" opacity="0.4" filter="url(#timeHalo)"/>

  <!-- Imperial Wizard King Cape (Red & Ermine Fur Collar) -->
  <path d="M 35,152 C 30,125 45,115 54,110 L 106,110 C 115,115 130,125 125,152 Z" fill="#9b111e" stroke="#5e0b12" stroke-width="2"/>
  
  <!-- White Ermine Fur Collar with black spots -->
  <path d="M 45,115 Q 80,128 115,115 Q 122,126 112,135 Q 80,144 48,135 Q 38,126 45,115 Z" fill="#f8f9fa" stroke="#d4af37" stroke-width="1.5"/>
  <ellipse cx="60" cy="126" rx="2" ry="3.5" fill="#1b1b1b" transform="rotate(-15, 60, 126)"/>
  <ellipse cx="80" cy="132" rx="2" ry="3.5" fill="#1b1b1b"/>
  <ellipse cx="100" cy="126" rx="2" ry="3.5" fill="#1b1b1b" transform="rotate(15, 100, 126)"/>
  <!-- Gold chain necklace -->
  <path d="M 64,115 Q 80,126 96,115" fill="none" stroke="url(#goldJulius)" stroke-width="2.5"/>

  <!-- Head / Face -->
  <path d="M 64,68 L 64,88 Q 80,104 96,88 L 96,68 Z" fill="#fceade"/>
  <path d="M 66,82 Q 80,96 94,82" fill="#f7d1ba"/>

  <!-- Blonde Hair -->
  <!-- Back/side hair -->
  <path d="M 56,68 L 48,56 L 60,50 L 54,38 L 70,36 L 76,24 L 84,24 L 90,36 L 106,38 L 100,50 L 112,56 L 104,68 L 98,54 L 90,62 L 80,48 L 70,62 L 62,54 Z" fill="#fae588" stroke="#d4af37" stroke-width="1.5"/>

  <!-- Eyes (Warm, curious smile) -->
  <path d="M 68,74 Q 74,70 78,74" stroke="#2b2d42" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 82,74 Q 86,70 92,74" stroke="#2b2d42" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="73" cy="74" r="2.5" fill="#48cae4"/>
  <circle cx="87" cy="74" r="2.5" fill="#48cae4"/>
  <circle cx="74" cy="73" r="1" fill="#ffffff"/>
  <circle cx="88" cy="73" r="1" fill="#ffffff"/>

  <!-- Nose & Gentle Smile -->
  <path d="M 80,72 L 78,80 L 82,80" stroke="#d4a373" stroke-width="1.5" fill="none"/>
  <path d="M 74,86 Q 80,91 86,86" stroke="#b05252" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Blue Temporal Magic Diamond Seal on Forehead -->
  <polygon points="80,56 83,61 80,66 77,61" fill="#00b4d8" stroke="#caf0f8" stroke-width="1" filter="url(#timeHalo)"/>
  <circle cx="80" cy="61" r="1.5" fill="#ffffff"/>
</svg>
