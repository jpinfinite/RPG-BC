<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Deep Fantasy Velvet & Leather Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0812"/>
      <stop offset="25%" stop-color="#120e1c"/>
      <stop offset="50%" stop-color="#090710"/>
      <stop offset="75%" stop-color="#100b1a"/>
      <stop offset="100%" stop-color="#050408"/>
    </linearGradient>

    <!-- Arcane Border Trim -->
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffd166" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7a5c1e" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Full Background Fill -->
  <rect x="0" y="0" width="1080" height="1920" fill="url(#bgGrad)"/>

  <!-- Ornate Outer Border Framing the Game Screen -->
  <rect x="12" y="12" width="1056" height="1896" rx="16" fill="none" stroke="url(#goldTrim)" stroke-width="2"/>
  <rect x="20" y="20" width="1040" height="1880" rx="12" fill="none" stroke="#251838" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>

  <!-- Subtle Corner Ornaments -->
  <!-- Top-Left -->
  <path d="M 24,60 L 60,24" stroke="url(#goldTrim)" stroke-width="3"/>
  <circle cx="42" cy="42" r="3" fill="#ffd166" opacity="0.6"/>
  <!-- Top-Right -->
  <path d="M 1056,60 L 1020,24" stroke="url(#goldTrim)" stroke-width="3"/>
  <circle cx="1038" cy="42" r="3" fill="#ffd166" opacity="0.6"/>
  <!-- Bottom-Left -->
  <path d="M 24,1860 L 60,1896" stroke="url(#goldTrim)" stroke-width="3"/>
  <circle cx="42" cy="1878" r="3" fill="#ffd166" opacity="0.6"/>
  <!-- Bottom-Right -->
  <path d="M 1056,1860 L 1020,1896" stroke="url(#goldTrim)" stroke-width="3"/>
  <circle cx="1038" cy="1878" r="3" fill="#ffd166" opacity="0.6"/>

  <!-- Arcane watermark symbols in background (Clover silhouette) -->
  <g transform="translate(540, 960) scale(3.5)" opacity="0.04">
    <path d="M 0,-40 C -25,-65 -55,-40 -35,-15 C -60,5 -35,35 -10,15 C -20,45 20,45 10,15 C 35,35 60,5 35,-15 C 55,-40 25,-65 0,-40 Z" fill="#ffd166"/>
  </g>
</svg>
