<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0038"/>
      <stop offset="60%" stop-color="#110019"/>
      <stop offset="100%" stop-color="#050008"/>
    </radialGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="35%" stop-color="#9900ff"/>
      <stop offset="65%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#c77dff"/>
    </linearGradient>
    <filter id="darkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background circular base -->
  <circle cx="48" cy="48" r="44" fill="url(#darkBg)"/>
  
  <!-- Outer Ring Elements -->
  <circle cx="48" cy="48" r="42" fill="none" stroke="#7b2cbf" stroke-width="2" stroke-dasharray="2 4" opacity="0.9"/>

  <!-- Dimensional Tear & Slash -->
  <g filter="url(#darkGlow)">
    <!-- Katana Dark Arc Slash -->
    <path d="M 16,80 C 24,64 36,36 82,14 C 64,32 46,62 30,82 Z" fill="url(#slashGrad)" stroke="#e0aaff" stroke-width="1.5"/>
    
    <!-- Spatial Crack (Dimensional Tear) -->
    <path d="M 80,16 L 62,32 L 66,36 L 50,48 L 54,54 L 38,66 L 42,70 L 22,82" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Secondary Dark Energy Tendrils -->
    <path d="M 50,48 Q 30,35 24,42 Q 35,46 44,52" fill="#5a189a" opacity="0.8"/>
    <path d="M 66,36 Q 74,48 80,44 Q 72,40 64,36" fill="#7b2cbf" opacity="0.8"/>
    <path d="M 38,66 Q 28,70 20,64 Q 28,62 36,64" fill="#9d4edd" opacity="0.7"/>

    <!-- Spark particles around the rip -->
    <polygon points="60,28 62,30 60,32 58,30" fill="#ffffff"/>
    <polygon points="46,42 48,44 46,46 44,44" fill="#ff79c6"/>
    <polygon points="34,60 36,62 34,64 32,62" fill="#ffffff"/>
    <polygon points="72,22 74,24 72,26 70,24" fill="#bd93f9"/>
    <polygon points="26,74 28,76 26,78 24,76" fill="#ff5555"/>
  </g>

  <!-- Rim highlight -->
  <circle cx="48" cy="48" r="44" fill="none" stroke="#9d4edd" stroke-width="3"/>
</svg>
