<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6d1f"/>
    </linearGradient>
  </defs>
  <!-- Outer circular frame with decorative notches -->
  <circle cx="48" cy="48" r="46" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>
  <circle cx="48" cy="48" r="42" fill="none" stroke="#22180c" stroke-width="2"/>
  
  <!-- Compass / Arc ticks at 0, 90, 180, 270 deg -->
  <rect x="46" y="0" width="4" height="8" rx="2" fill="#ffd166"/>
  <rect x="46" y="88" width="4" height="8" rx="2" fill="#ffd166"/>
  <rect x="0" y="46" width="8" height="4" rx="2" fill="#ffd166"/>
  <rect x="88" y="46" width="8" height="4" rx="2" fill="#ffd166"/>
  
  <!-- Diagonal corner stars -->
  <circle cx="15" cy="15" r="2.5" fill="#ffffff"/>
  <circle cx="81" cy="15" r="2.5" fill="#ffffff"/>
  <circle cx="15" cy="81" r="2.5" fill="#ffffff"/>
  <circle cx="81" cy="81" r="2.5" fill="#ffffff"/>
</svg>
