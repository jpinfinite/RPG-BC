<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <radialGradient id="lionBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a1a00"/>
      <stop offset="60%" stop-color="#3d0a00"/>
      <stop offset="100%" stop-color="#140200"/>
    </radialGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff1a00"/>
      <stop offset="50%" stop-color="#ff7700"/>
      <stop offset="100%" stop-color="#ffee55"/>
    </linearGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background circular base -->
  <circle cx="48" cy="48" r="44" fill="url(#lionBg)"/>
  
  <!-- Outer Ring Elements -->
  <circle cx="48" cy="48" r="42" fill="none" stroke="#ff5500" stroke-width="2" stroke-dasharray="4 2" opacity="0.7"/>

  <!-- Lion Mane / Flames -->
  <g filter="url(#flameGlow)">
    <!-- Mane fire spikes -->
    <path d="M 48,12 C 43,24 35,22 30,16 C 31,25 24,25 18,22 C 24,30 20,36 14,38 C 22,43 19,51 14,56 C 22,58 23,67 18,74 C 27,70 30,78 28,84 C 36,78 41,83 48,86 C 55,83 60,78 68,84 C 66,78 69,70 78,74 C 73,67 74,58 82,56 C 77,51 74,43 82,38 C 76,36 72,30 78,22 C 72,25 65,25 66,16 C 61,22 53,24 48,12 Z" fill="url(#fireGrad)"/>
    
    <!-- Lion Face Inner Mask -->
    <path d="M 48,26 L 36,44 L 40,62 L 48,74 L 56,62 L 60,44 Z" fill="#2a0500" stroke="#ffaa00" stroke-width="2"/>
    <!-- Glowing Eyes -->
    <polygon points="40,46 43,49 37,51" fill="#ffffff"/>
    <polygon points="56,46 53,49 59,51" fill="#ffffff"/>
    <!-- Snout & Roar Mouth -->
    <polygon points="48,52 45,58 51,58" fill="#ff4400"/>
    <path d="M 44,61 Q 48,68 52,61 Q 48,70 44,61 Z" fill="#ffeeaa"/>
    <!-- Fangs -->
    <polygon points="45,61 46,65 47,61" fill="#ffffff"/>
    <polygon points="49,61 50,65 51,61" fill="#ffffff"/>
  </g>

  <!-- Rim highlight -->
  <circle cx="48" cy="48" r="44" fill="none" stroke="#ffaa22" stroke-width="3"/>
</svg>
