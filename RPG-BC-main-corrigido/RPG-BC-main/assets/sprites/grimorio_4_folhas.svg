<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="256" height="320">
  <defs>
    <linearGradient id="cover4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="45%" stop-color="#f5e6b8"/>
      <stop offset="100%" stop-color="#dfbe70"/>
    </linearGradient>
    <filter id="glow4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Book Spine & Pages with Gold Edges -->
  <rect x="24" y="24" width="216" height="276" rx="14" fill="#ffd700" stroke="#b8860b" stroke-width="4"/>
  <!-- Front Cover -->
  <rect x="18" y="20" width="212" height="280" rx="12" fill="url(#cover4)" stroke="#e6b800" stroke-width="6"/>
  <!-- Royal Gold Filigree Borders -->
  <rect x="30" y="32" width="188" height="256" rx="8" fill="none" stroke="#d4af37" stroke-width="3"/>
  <circle cx="124" cy="150" r="68" fill="none" stroke="#d4af37" stroke-width="2" stroke-dasharray="6 3"/>
  <!-- Ornate Golden Corners -->
  <path d="M 18,60 L 60,18 L 18,18 Z" fill="#ffd700"/>
  <path d="M 188,18 L 230,60 L 230,18 Z" fill="#ffd700"/>
  <path d="M 18,260 L 60,302 L 18,302 Z" fill="#ffd700"/>
  <path d="M 188,302 L 230,260 L 230,302 Z" fill="#ffd700"/>
  <!-- 4-Leaf Clover (Destiny / Good Luck) -->
  <g transform="translate(124, 150)" filter="url(#glow4)">
    <!-- Top Leaf -->
    <path d="M 0,0 C -25,-35 -5,-55 0,-30 C 5,-55 25,-35 0,0 Z" fill="#ffd700"/>
    <!-- Bottom Leaf -->
    <path d="M 0,0 C -25,35 -5,55 0,30 C 5,55 25,35 0,0 Z" fill="#ffb700"/>
    <!-- Left Leaf -->
    <path d="M 0,0 C -35,-25 -55,-5 -30,0 C -55,5 -35,25 0,0 Z" fill="#ffc107"/>
    <!-- Right Leaf -->
    <path d="M 0,0 C 35,-25 55,-5 30,0 C 55,5 35,25 0,0 Z" fill="#ffc107"/>
    <!-- Sparkle rays -->
    <polygon points="0,-48 4,-12 18,-18 7,-4 48,0 7,4 18,18 4,12 0,48 -4,12 -18,18 -7,4 -48,0 -7,-4 -18,-18 -4,-12" fill="#fff" opacity="0.8"/>
    <circle cx="0" cy="0" r="7" fill="#ffffff"/>
  </g>
</svg>
