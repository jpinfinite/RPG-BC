<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="yamiBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2c1a35"/>
      <stop offset="70%" stop-color="#140b1c"/>
      <stop offset="100%" stop-color="#08020b"/>
    </radialGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997316"/>
    </linearGradient>
    <filter id="darkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="80" cy="80" r="74" fill="url(#yamiBg)"/>
  <circle cx="80" cy="80" r="72" fill="none" stroke="url(#goldTrim)" stroke-width="3"/>
  <circle cx="80" cy="80" r="68" fill="none" stroke="#3c1053" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Dark Magic Aura in background -->
  <path d="M 40,80 Q 20,40 50,30 Q 80,15 110,30 Q 140,40 120,80 Q 140,120 110,135 Q 80,145 50,135 Q 20,120 40,80 Z" fill="#4d1266" opacity="0.35" filter="url(#darkGlow)"/>

  <!-- Yami Body & Muscular Shoulders / White Tank Top -->
  <path d="M 40,148 L 48,110 L 62,105 L 98,105 L 112,110 L 120,148 Z" fill="#e8e8e8" stroke="#111111" stroke-width="2"/>
  <!-- Muscle details / neck -->
  <path d="M 72,95 L 72,110 M 88,95 L 88,110" stroke="#c48f65" stroke-width="2"/>
  
  <!-- Black Bulls Squad Cape (Over Left Shoulder) -->
  <path d="M 38,105 C 30,118 28,140 32,150 L 65,150 L 58,112 Z" fill="#151515" stroke="#111111" stroke-width="2"/>
  <!-- Cape Gold Bull Crest Trim -->
  <path d="M 34,115 Q 46,120 54,116" stroke="url(#goldTrim)" stroke-width="3" fill="none"/>
  <circle cx="44" cy="130" r="8" fill="none" stroke="url(#goldTrim)" stroke-width="2"/>
  <path d="M 38,124 Q 44,136 50,124" stroke="url(#goldTrim)" stroke-width="2" fill="none"/>

  <!-- Head / Face -->
  <path d="M 62,64 L 62,88 Q 80,105 98,88 L 98,64 Z" fill="#d89b6f"/>
  <path d="M 64,82 Q 80,98 96,82" fill="#c4855a"/>

  <!-- Stubble / Beard -->
  <path d="M 68,88 Q 80,98 92,88 Q 80,92 68,88 Z" fill="#222222" opacity="0.6"/>
  <path d="M 65,80 Q 64,87 70,92" stroke="#222222" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
  <path d="M 95,80 Q 96,87 90,92" stroke="#222222" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>

  <!-- Spiky Black Hair -->
  <!-- Back/side hair -->
  <path d="M 52,65 L 42,52 L 56,48 L 50,34 L 66,36 L 68,20 L 80,30 L 92,20 L 94,36 L 110,34 L 104,48 L 118,52 L 108,65 L 102,52 L 96,62 L 90,46 L 80,56 L 70,46 L 64,62 L 58,52 Z" fill="#1a1a1d" stroke="#000000" stroke-width="1.5"/>

  <!-- Eyes (Intense squinting gaze) -->
  <line x1="68" y1="68" x2="77" y2="70" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="83" y1="70" x2="92" y2="68" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="73" cy="72" r="1.5" fill="#2a1a08"/>
  <circle cx="87" cy="72" r="1.5" fill="#2a1a08"/>

  <!-- Nose -->
  <path d="M 80,68 L 78,79 L 83,79" stroke="#99582a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Mouth with Lit Cigarette -->
  <path d="M 74,86 Q 80,88 86,85" stroke="#441111" stroke-width="2" fill="none"/>
  
  <!-- Cigarette -->
  <rect x="83" y="84" width="16" height="3.5" rx="1" transform="rotate(12, 83, 84)" fill="#ffffff" stroke="#333333" stroke-width="0.5"/>
  <rect x="97" y="87" width="2" height="3.5" transform="rotate(12, 97, 87)" fill="#ff3300"/>
  <!-- Smoke puffs from cigarette -->
  <path d="M 100,88 Q 106,82 108,76 Q 112,68 118,70 Q 124,72 120,62" stroke="#e0e0e0" stroke-width="2" fill="none" opacity="0.75" stroke-linecap="round"/>
  <circle cx="120" cy="58" r="2.5" fill="#f0f0f0" opacity="0.6"/>

  <!-- Katana Hilt on Right Shoulder -->
  <g transform="translate(108, 98) rotate(-35)">
    <!-- Tsuba (Guard) -->
    <rect x="-4" y="0" width="16" height="4" rx="1.5" fill="#333333" stroke="url(#goldTrim)" stroke-width="1"/>
    <!-- Tsuka (Handle with wrapping) -->
    <rect x="-1" y="-22" width="10" height="22" rx="2" fill="#1b120c" stroke="#111111" stroke-width="1.5"/>
    <line x1="-1" y1="-18" x2="9" y2="-14" stroke="url(#goldTrim)" stroke-width="1.5"/>
    <line x1="-1" y1="-10" x2="9" y2="-6" stroke="url(#goldTrim)" stroke-width="1.5"/>
  </g>
</svg>
